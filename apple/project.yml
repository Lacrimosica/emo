# Xcode project definition. Regenerate the project with: `cd apple && xcodegen`
# The app's sources use a synced folder, so adding files in Xcode does not require regenerating.
name: Emo
options:
  bundleIdPrefix: dev.emo
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Free Apple ID "Personal Team" (ticket 23): a stable signature, so macOS keeps permissions
    # across rebuilds. Free provisioning has no iCloud capability (ticket 14 needs a paid team).
    DEVELOPMENT_TEAM: 3R99LV35Q6
packages:
  EmoKit:
    path: EmoKit
targets:
  Emo:
    type: application
    platform: macOS
    sources:
      - path: Emo
        type: syncedFolder
      # Platform-neutral app code shared with the iPhone app (ticket 24).
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: EmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emo.Emo
        PRODUCT_NAME: Emo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Emo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Emo listens while you dictate a task.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Emo turns your dictated task into text, on this Mac when possible.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Emo shows your calendar events and plans your tasks around them.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Emo brings your reminders into its backlog so it can schedule them.
        CODE_SIGN_ENTITLEMENTS: Emo/Emo.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  EmoPhone:
    type: application
    platform: iOS
    sources:
      - path: EmoPhone
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: EmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emo.EmoPhone
        PRODUCT_NAME: Emo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Emo
        INFOPLIST_FILE: Config/EmoPhone-Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Emo listens while you dictate a task.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Emo turns your dictated task into text, on this iPhone when possible.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Emo shows your calendar events and plans your tasks around them.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Emo brings your reminders into its backlog so it can schedule them.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Device installs with the free team expire after 7 days: re-run from Xcode.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  Emo:
    build:
      targets:
        Emo: all
    test:
      targets:
        - package: EmoKit/EmoKitTests
  EmoPhone:
    build:
      targets:
        EmoPhone: all
